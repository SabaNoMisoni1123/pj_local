# codex_config_template.toml for Codex
#
# 移植先では project_root/.codex/config.toml として扱う。
# モデル、承認、サンドボックス、TUI、MCP などの運用設定は、
# 原則としてプロジェクトフォルダ内のこのファイルで完結させる。
# $HOME/.codex/config.toml には、プロジェクトの trust_level だけを置く。

# model
model = "gpt-5.5"
model_reasoning_effort = "low"
# 性能優先時の候補: medium, high, xhigh

model_reasoning_summary = "concise"
# さらに削減する場合の候補:
# model_reasoning_summary = "none"
# 性能・状況把握を優先する場合の候補:
# model_reasoning_summary = "auto"

model_verbosity = "low"
# 性能・説明量を優先する場合の候補: medium, high

# AGENTS.md 等のプロジェクト指示読み込み上限。
# 低くしすぎると重要ルールが読み込まれないため、まずは 12KB 程度を既定にする。
project_doc_max_bytes = 12000
# 指示の取りこぼしを避けたい場合の候補: 16000, 32768

# 編集を任せ、コマンドの承認も不要。
sandbox_mode = "workspace-write"
approval_policy = "never"

# Codex の表示・応答スタイル
personality = "pragmatic"

# Web検索ツール
# cached: 既定。OpenAI管理の検索キャッシュ
# live: 最新情報取得。--search 相当
# disabled: 無効
web_search = "cached"
approvals_reviewer = "user"

# 通知
[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "unfocused"
notification_method = "auto"

[tui.model_availability_nux]
"gpt-5.5" = 4

# workspace-write にした場合のみ有効
# read-only のままなら実質使われません
[sandbox_workspace_write]
network_access = false
exclude_slash_tmp = true
exclude_tmpdir_env_var = true

# PowerShell 環境では、shell に渡す環境変数を config.toml で明示すると
# 起動時エラーの原因になる場合があるため、この雛形では
# [shell_environment_policy] を定義しない。

[features]
undo = true
shell_snapshot = true

# MCPサーバ
#
# トークン削減を優先する場合の基本方針:
# - 常時有効にするMCPサーバは、そのプロジェクトで高頻度に使うものだけに絞る。
# - MCPサーバは、ツール名・説明・引数スキーマ・実行結果がモデルの文脈に入るため、
#   サーバ数やツール数が多すぎると入力トークンや探索コストが増える場合がある。
# - 一方で、検索・フィルタ・ページング・範囲指定により必要箇所だけ取得できるMCPは、
#   ファイル全文・ログ全文・ドキュメント全体を読ませるよりトークン削減に有効。
# - 似た機能のMCPサーバを複数常時有効にすると、ツール選択の迷いと無駄な呼び出しが増えやすい。
# - 外部サービス接続系MCPは、案件で実際に使う場合だけ有効化する。
#
# 有効化の目安:
# - context7: ライブラリ/API/フレームワークの最新公式ドキュメントを確認する案件では有効。
# - markitdown: PDF、Office文書、HTML等を扱う案件では有効。コード中心案件では必須ではない。
# - ultracite: Ultracite/Biome等の関連技術を使う案件で有効。無関係な案件ではコメントアウト候補。
# - google-drive: Drive上の文書・表・スライドを頻繁に参照する案件で有効。
#   機密性や接続範囲も考慮し、不要な案件では無効化する。


# [mcp_servers.context7]
# command = "npx"
# args = ["-y", "@upstash/context7-mcp@latest"]
# startup_timeout_sec = 30
# tool_timeout_sec = 60

# [mcp_servers.markitdown]
# command = "markitdown-mcp"

# [mcp_servers.ultracite]
# command = "npx"
# args = [
#   "-y",
#   "mcp-remote",
#   "https://docs.ultracite.ai/mcp"
# ]
# startup_timeout_sec = 30
# tool_timeout_sec = 60

# [plugins."google-drive@openai-curated"]
# enabled = true

# project trust
# プロジェクトの信頼設定だけは $HOME/.codex/config.toml で管理する。
# この雛形には [projects.'...'] を置かない。
# 例:
# [projects.'c:\path\to\project']
# trust_level = "trusted"
